[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart", "http1", "macros"] }
axum-extra = { version = "0.9.3", features = ["form"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
bytes = "1"
serde_json = "1.0"
bcrypt = "0.17.1"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
chrono = "0.4.42"
once_cell = "1.21.3"
dashmap = "6.1.0"
sha2 = "0.10.9"
hmac = "0.12.1"
dotenvy = "0.15"
tower-sessions = "0.12.1"
tower-sessions-memory-store = "0.12.3"
time = { version = "0.3.36", features = ["macros"] }
atomic-counter =  "1.0.0"
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
anyhow = "1.0.86"

[dev-dependencies]
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serial_test = "3.0.0"
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["full"] }
