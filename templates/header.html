<header>
    <div class="header-left">
        <a href="/portal/dashboard" class="pcloud-button">pCloud</a>
        <div class="divider"></div>
        <div class="services-dropdown">
            <div class="services-icon" onclick="toggleServicesDropdown()">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>
            <div id="servicesDropdown" class="services-dropdown-content">
                <input type="text" placeholder="Search.." id="serviceSearch" onkeyup="filterServices()">
                {% for service in services %}
                <a href="/portal/service/{{ service }}">{{ service }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class="header-center">
        <div class="search-bar">
            <span class="search-icon">&#128269;</span>
            <input type="text" class="search-input" placeholder="Search">
            <span class="search-shortcut">[Option+S]</span>
        </div>
    </div>
    <div class="header-right">
        {% if let Some(user) = user %}
        <div class="user-info">{{ user.username }}</div>
        <div class="divider"></div>
        <div class="account-dropdown">
            <button class="account-button">Account</button>
            <div class="dropdown-content">
                <a href="/portal/settings">Settings</a>
                <a href="/portal/logout">Logout</a>
            </div>
        </div>
        {% endif %}
    </div>
</header>
<style>
    body {
        margin: 0;
        font-family: sans-serif;
    }
    header {
        background-color: #232f3e;
        color: white;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #4a5c6d;
    }
    .header-left, .header-right {
        display: flex;
        align-items: center;
    }
    .header-center {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        padding: 0 20px;
    }
    .services-icon {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        width: 18px;
        height: 18px;
        cursor: pointer;
    }
    .square {
        width: 4px;
        height: 4px;
        background-color: #c9d1d9;
    }
    .search-bar {
        display: flex;
        align-items: center;
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 7px 12px;
        width: 100%;
        max-width: 500px;
        color: #c9d1d9;
    }
    .search-icon {
        margin-right: 8px;
    }
    .search-input {
        flex-grow: 1;
        background-color: transparent;
        border: none;
        color: #c9d1d9;
        font-size: 14px;
    }
    .search-input:focus {
        outline: none;
    }
    .search-shortcut {
        color: #8b949e;
    }
    .divider {
        height: 25px;
        width: 1px;
        background-color: #4a5c6d;
        margin: 0 15px;
    }
    .pcloud-button {
        background-color: transparent;
        color: white;
        border: 1px solid #7d8da1;
        padding: 4px 12px;
        border-radius: 3px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
    }
    .pcloud-button:hover {
        background-color: #4a5c6d;
    }
    .user-info {
        margin-right: 20px;
    }
    .account-dropdown {
        position: relative;
        display: inline-block;
    }
    .account-button {
        background-color: transparent;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
        right: 0;
    }
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }
    .dropdown-content a:hover {
        background-color: #f1f1f1;
    }
    .account-dropdown:hover .dropdown-content {
        display: block;
    }
    .services-dropdown {
        position: relative;
        display: inline-block;
    }

    .services-dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
    }

    .services-dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }

    .services-dropdown-content a:hover {background-color: #f1f1f1}

    .show {display:block;}
</style>
<script>
    function toggleServicesDropdown() {
        document.getElementById("servicesDropdown").classList.toggle("show");
    }

    function filterServices() {
        var input, filter, a, i;
        input = document.getElementById("serviceSearch");
        filter = input.value.toUpperCase();
        div = document.getElementById("servicesDropdown");
        a = div.getElementsByTagName("a");
        for (i = 0; i < a.length; i++) {
            txtValue = a[i].textContent || a[i].innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                a[i].style.display = "";
            } else {
                a[i].style.display = "none";
            }
        }
    }
</script>
