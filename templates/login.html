<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pCloud - Login</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
            width: 400px;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .description {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #FF9D00;
            color: black;
        }
        .btn-secondary {
            background-color: #e7e9ec;
            color: #111;
            border: 1px solid #999;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }
        .divider:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: #ddd;
            left: 0;
            top: 50%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign in to pCloud</h1>
        <form action="/portal/login" method="post">
            <div class="input-group">
                <label for="username">Email address</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <div class="divider"><span>OR</span></div>
        <a href="/portal/register" style="text-decoration: none;">
            <button class="btn btn-secondary" style="width:100%">Create a new pCloud account</button>
        </a>
    </div>
</body>
</html>
